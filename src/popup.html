<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 272px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      label {
        user-select: none;
      }
      .slider {
        margin-bottom: 12px;
      }
      .slider > .row {
        margin-bottom: 2px;
      }
      input[type="range"] {
        width: 100%;
        margin: 0;
      }
      select {
        font: inherit;
        padding: 2px 4px;
      }
      .value {
        font-variant-numeric: tabular-nums;
        opacity: 0.65;
      }
      .section {
        margin: 14px 0 10px;
        padding-top: 12px;
        border-top: 1px solid rgba(128, 128, 128, 0.25);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.5;
      }
      .hint {
        margin: 12px 0 0;
        padding-top: 10px;
        border-top: 1px solid rgba(128, 128, 128, 0.25);
        font-size: 11px;
        line-height: 1.5;
        opacity: 0.6;
      }
      #unsupported {
        display: none;
        margin-bottom: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(220, 60, 60, 0.12);
        color: #d33;
        font-size: 12px;
      }
      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }
      fieldset[disabled] {
        opacity: 0.45;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1>
      VidSharp
      <input type="checkbox" id="enabled" />
    </h1>

    <div id="unsupported">此浏览器不支持 WebGPU，扩展无法工作。</div>

    <fieldset id="controls">
      <div class="row">
        <label for="upscale">超分辨率</label>
        <select id="upscale">
          <option value="off">关闭</option>
          <option value="2k">放大到 2K</option>
          <option value="4k">放大到 4K</option>
          <option value="2x">2 倍放大</option>
        </select>
      </div>

      <div class="section">锐化</div>

      <div class="slider">
        <div class="row">
          <label for="strength">强度</label>
          <span class="value" id="strengthValue">50</span>
        </div>
        <input type="range" id="strength" min="0" max="100" step="5" />
      </div>

      <div class="row">
        <label for="denoise">噪声抑制</label>
        <input type="checkbox" id="denoise" />
      </div>

      <div class="section">画质修复</div>

      <div class="slider">
        <div class="row">
          <label for="deblock" title="消除低码率视频的方块状伪影">去块</label>
          <span class="value" id="deblockValue">40</span>
        </div>
        <input type="range" id="deblock" min="0" max="100" step="5" />
      </div>

      <div class="slider">
        <div class="row">
          <label for="deband" title="消除天空、渐变面上的条纹">去色带</label>
          <span class="value" id="debandValue">30</span>
        </div>
        <input type="range" id="deband" min="0" max="100" step="5" />
      </div>

      <div class="slider">
        <div class="row">
          <label for="contrast" title="提升暗部与局部细节">局部对比度</label>
          <span class="value" id="contrastValue">25</span>
        </div>
        <input type="range" id="contrast" min="0" max="100" step="5" />
      </div>

      <div class="section">细节生成</div>

      <div class="slider">
        <div class="row">
          <label for="grain" title="注入合成胶片颗粒，增加质感。这是唯一真正增加细节的选项">
            胶片颗粒
          </label>
          <span class="value" id="grainValue">0</span>
        </div>
        <input type="range" id="grain" min="0" max="100" step="5" />
      </div>

      <div class="slider">
        <div class="row">
          <label for="grainSize" title="颗粒粗细，1 = 逐像素，越大越粗">颗粒粗细</label>
          <span class="value" id="grainSizeValue">1</span>
        </div>
        <input type="range" id="grainSize" min="1" max="3" step="0.5" />
      </div>

      <div class="section">对比</div>

      <div class="row">
        <label for="badge" title="在视频角落显示标识，确认当前画面已被增强">
          状态角标
        </label>
        <select id="badge">
          <option value="corner">简洁</option>
          <option value="detail">详细参数</option>
          <option value="off">关闭</option>
        </select>
      </div>

      <div class="row">
        <label for="compare" title="拖动分割条对比处理前后">拖动对比</label>
        <input type="checkbox" id="compare" />
      </div>
    </fieldset>

    <p class="hint">
      左侧为处理后，右侧为原始画面。<br />
      受 DRM 保护的视频（Netflix 等）无法处理。
    </p>

    <script src="popup.js"></script>
  </body>
</html>
