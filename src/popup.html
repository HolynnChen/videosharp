<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      label {
        user-select: none;
      }
      input[type="range"] {
        width: 100%;
      }
      .value {
        font-variant-numeric: tabular-nums;
        opacity: 0.7;
      }
      .hint {
        margin: 0;
        padding-top: 12px;
        border-top: 1px solid rgba(128, 128, 128, 0.25);
        font-size: 11px;
        line-height: 1.5;
        opacity: 0.6;
      }
      #unsupported {
        display: none;
        margin-bottom: 12px;
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(220, 60, 60, 0.12);
        color: #d33;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>VidSharp</h1>

    <div id="unsupported">此浏览器不支持 WebGPU，扩展无法工作。</div>

    <div class="row">
      <label for="enabled">启用锐化</label>
      <input type="checkbox" id="enabled" />
    </div>

    <div>
      <div class="row" style="margin-bottom: 4px">
        <label for="strength">强度</label>
        <span class="value" id="strengthValue">50</span>
      </div>
      <input type="range" id="strength" min="0" max="100" step="5" />
    </div>

    <div class="row" style="margin-top: 14px">
      <label for="denoise">噪声抑制</label>
      <input type="checkbox" id="denoise" />
    </div>

    <div class="row">
      <label for="splitPreview" title="只锐化画面左半边，便于左右对比">
        分屏对比
      </label>
      <input type="checkbox" id="splitPreview" />
    </div>

    <p class="hint">
      设置对所有站点生效，切换后立即应用。<br />
      受 DRM 保护的视频（Netflix 等）无法处理。
    </p>

    <script src="popup.js"></script>
  </body>
</html>
