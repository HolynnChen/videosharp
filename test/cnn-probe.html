<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>VidSharp — CNN 超分可行性探针</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 820px;
        margin: 0 auto;
        padding: 32px 20px 64px;
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { opacity: 0.6; margin: 0 0 24px; font-size: 13px; }
      button {
        font: inherit;
        padding: 8px 18px;
        margin: 0 6px 8px 0;
        border-radius: 6px;
        border: 1px solid rgba(128,128,128,0.4);
        background: rgba(128,128,128,0.08);
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .env {
        margin: 18px 0;
        padding: 12px 14px;
        border-radius: 8px;
        background: rgba(128,128,128,0.1);
        font-size: 13px;
      }
      .env div { margin: 2px 0; }
      pre {
        margin: 18px 0 0;
        padding: 14px;
        border-radius: 8px;
        background: rgba(128,128,128,0.1);
        font-size: 12.5px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .verdict {
        margin: 20px 0 0;
        padding: 14px 16px;
        border-radius: 8px;
        font-weight: 600;
      }
      .verdict.bad { background: rgba(220,60,60,0.14); color: #d33; }
      .verdict.ok  { background: rgba(40,170,90,0.14); color: #1a8; }
      .verdict.warn { background: rgba(230,160,30,0.16); color: #b80; }
      .note { margin-top: 22px; font-size: 12px; opacity: 0.65; }
    </style>
  </head>
  <body>
    <h1>CNN 超分可行性探针</h1>
    <p class="sub">
      测量轻量超分模型在本机 WebGPU 上的真实推理耗时，并诊断 GPU 是否被充分利用。
    </p>

    <div class="env" id="env">检测环境…</div>

    <button id="run">基础测试 (WebGPU)</button>
    <button id="runFull">完整诊断 (含批处理/回退检测)</button>
    <button id="runWasm">加测 WASM 对照</button>
    <button id="abort" disabled>中止</button>

    <div id="verdict"></div>
    <pre id="log">等待开始…</pre>

    <p class="note">
      实时视频预算：<strong>16.7ms/帧</strong>（60fps）或 <strong>33ms/帧</strong>（30fps）。<br />
      两个模型的输入空间尺寸都是硬编码的，1080p 必须分块，每块一次前向。
      此处未计入块间重叠与融合开销 —— 真实耗时会更高。
    </p>

    <script type="module">
      const MODELS = [
        {
          name: "ESPCN",
          file: "../models/espcn.onnx",
          tile: 224, ch: 1, scale: 3,
        },
        {
          name: "realesr-general-x4v3",
          file: "../models/realesr-general.onnx",
          tile: 128, ch: 3, scale: 4,
          // 单块约 250ms 且中间张量大，诊断时需减少迭代与 batch 上限，
          // 否则反复创建 session 会撑爆 WASM 堆
          heavy: true,
        },
      ];

      const BUDGET_60 = 1000 / 60;
      const BUDGET_30 = 1000 / 30;

      const logEl = document.getElementById("log");
      const lines = [];
      const log = (m = "") => { lines.push(m); logEl.textContent = lines.join("\n"); };
      const setVerdict = (cls, text) => {
        const el = document.getElementById("verdict");
        el.className = "verdict " + cls;
        el.textContent = text;
      };

      // 中止标志。诊断项之间检查，避免长流程无法中断。
      let aborted = false;
      class Aborted extends Error {}
      const checkAbort = () => { if (aborted) throw new Aborted("已中止"); };

      /* ---- 环境 ---- */
      let adapter = null;
      let device = null;
      async function detectEnv() {
        const rows = [];
        rows.push(`浏览器: ${navigator.userAgent.match(/(Chrome|Edg|Safari|Firefox)\/[\d.]+/)?.[0] || "未知"}`);
        rows.push(`平台: ${navigator.platform}`);
        if (!navigator.gpu) {
          rows.push(`WebGPU: <strong style="color:#d33">不可用</strong>`);
        } else {
          adapter = await navigator.gpu.requestAdapter();
          if (!adapter) {
            rows.push(`WebGPU: <strong style="color:#d33">无法获取 adapter</strong>`);
          } else {
            const i = adapter.info || {};
            rows.push(`GPU: ${[i.vendor, i.architecture, i.description].filter(Boolean).join(" / ") || "(信息受限)"}`);
            rows.push(`最大纹理: ${adapter.limits.maxTextureDimension2D} · 最大计算工作组: ${adapter.limits.maxComputeWorkgroupSizeX}`);
          }
        }
        document.getElementById("env").innerHTML =
          rows.map((r) => `<div>${r}</div>`).join("");
      }
      await detectEnv();

      /* ---- ORT ---- */
      let ort = null;
      async function loadOrt() {
        if (ort) return ort;
        ort = await import("../node_modules/onnxruntime-web/dist/ort.webgpu.min.mjs");
        // 相对路径会被拼到模块目录下变成错误路径，必须绝对 URL
        ort.env.wasm.wasmPaths =
          new URL("../node_modules/onnxruntime-web/dist/", location.href).href;
        // 多线程依赖 blob worker，扩展/严格 CSP 下会失败
        ort.env.wasm.numThreads = 1;
        ort.env.logLevel = "warning";
        return ort;
      }

      async function checkModels() {
        const missing = [];
        for (const m of MODELS) {
          const r = await fetch(m.file, { method: "HEAD" }).catch(() => null);
          if (!r || !r.ok) missing.push(m.file.replace("../", ""));
        }
        if (missing.length) {
          log(`\n✗ 缺少模型:\n    ${missing.join("\n    ")}`);
          log(`\n  请先运行:  npm run fetch-models`);
          setVerdict("warn", "缺少模型文件，请先运行 npm run fetch-models");
          return false;
        }
        return true;
      }

      function makeSession(o, file, ep) {
        return o.InferenceSession.create(file, {
          executionProviders: [ep],
          graphOptimizationLevel: "all",
        });
      }

      function makeFeed(o, session, model, batch) {
        const feeds = {};
        feeds[session.inputNames[0]] = new o.Tensor(
          "float32",
          new Float32Array(batch * model.ch * model.tile * model.tile).fill(0.5),
          [batch, model.ch, model.tile, model.tile],
        );
        return feeds;
      }

      /* session.release() 返回 Promise —— 不 await 的话 WASM 堆还没回收就
       * 又创建下一个 session，反复几轮后会 "memory access out of bounds"。
       * 早期版本的 realesr 诊断就是这样崩的。 */
      async function dispose(...sessions) {
        for (const s of sessions) {
          if (!s) continue;
          try {
            await s.release?.();
          } catch (err) {
            log(`  (释放 session 失败: ${err.message.slice(0, 60)})`);
          }
        }
        // 让出一轮事件循环，给 ORT 的内部清理留出时机
        await new Promise((r) => setTimeout(r, 0));
      }

      async function timeRuns(session, feeds, n) {
        const times = [];
        for (let i = 0; i < n; i++) {
          checkAbort();
          const t = performance.now();
          await session.run(feeds);
          times.push(performance.now() - t);
          await new Promise((r) => setTimeout(r, 0));
        }
        times.sort((a, b) => a - b);
        return { median: times[Math.floor(n / 2)], best: times[0] };
      }

      /* ---- 基础测试 ---- */
      async function basic(model, ep) {
        const o = await loadOrt();
        log(`\n── ${model.name} [${ep}] ──`);
        let session;
        try {
          const t = performance.now();
          session = await makeSession(o, model.file, ep);
          log(`  加载: ${(performance.now() - t).toFixed(0)}ms`);
        } catch (err) {
          if (err instanceof Aborted) throw err;
          log(`  ✗ 加载失败: ${err.message}`);
          return { model, ep, error: err.message };
        }

        const feeds = makeFeed(o, session, model, 1);
        const tw = performance.now();
        try {
          await session.run(feeds);
        } catch (err) {
          if (err instanceof Aborted) throw err;
          log(`  ✗ 推理失败: ${err.message}`);
          await dispose(session);
          return { model, ep, error: err.message };
        }
        log(`  warmup: ${(performance.now() - tw).toFixed(0)}ms`);

        const { median, best } = await timeRuns(session, feeds, 10);
        const tiles = Math.ceil(1920 / model.tile) * Math.ceil(1080 / model.tile);
        const frameMs = median * tiles;
        log(`  单块: 中位 ${median.toFixed(2)}ms / 最快 ${best.toFixed(2)}ms  [${model.tile}²]`);
        log(`  1080p: ${tiles} 块 × ${median.toFixed(2)}ms = ${frameMs.toFixed(0)}ms → ${(1000/frameMs).toFixed(1)} fps`);
        log(`  距 60fps: 需再快 ${(frameMs / BUDGET_60).toFixed(0)}×`);

        await dispose(session);
        return { model, ep, median, tiles, frameMs };
      }

      /* ---- 诊断 1: 算子回退 ----
       * WebGPU 相对单线程 WASM 的加速比若明显偏低（<8x），几乎肯定有算子
       * 掉回 CPU —— 那会导致每层间 GPU/CPU 同步，GPU 大部分时间在等。
       * ORT Web 不暴露逐节点 EP 归属的公开 API，故用加速比间接判定。 */
      async function diagFallback(model) {
        const o = await loadOrt();
        log(`\n── 回退诊断: ${model.name} ──`);
        const out = {};
        // 重型模型少测几次：每次 session 创建都要重新分配 WASM 堆，
        // 250ms/次的模型跑 6 轮 × 2 EP 很容易把堆撑爆
        const iters = model.heavy ? 2 : 6;
        for (const ep of ["webgpu", "wasm"]) {
          let s = null;
          try {
            s = await makeSession(o, model.file, ep);
            const f = makeFeed(o, s, model, 1);
            await s.run(f);
            const { median } = await timeRuns(s, f, iters);
            out[ep] = median;
          } catch (err) {
            if (err instanceof Aborted) throw err;
            log(`  ${ep} 失败: ${err.message}`);
          } finally {
            await dispose(s);
          }
        }
        if (out.webgpu && out.wasm) {
          const ratio = out.wasm / out.webgpu;
          log(`  WebGPU ${out.webgpu.toFixed(2)}ms vs WASM ${out.wasm.toFixed(2)}ms → 加速 ${ratio.toFixed(1)}×`);
          if (ratio < 8) {
            log(`  ⚠ 加速比偏低，很可能有算子回退到 CPU。`);
            log(`    该模型算子: ${model.name.includes("realesr") ? "Conv/PRelu/DepthToSpace/Resize/Add" : "Conv/Relu/Reshape/Transpose"}`);
            if (model.name.includes("realesr")) {
              log(`    嫌疑: PRelu（非 LeakyRelu，是带参数的不同算子）、Resize`);
            }
          } else {
            log(`  ✓ 加速比正常，算子应当全在 GPU 上。`);
          }
          out.ratio = ratio;
        }
        return out;
      }

      /* ---- 诊断 2: 批处理 ----
       * 单块 224² 只有 5 万像素，填不满 M1 的上百个执行单元；且逐块
       * await 会在每块之间插入完整的 JS→GPU→JS 往返。批处理若能把多块
       * 合成一次提交，可同时改善并行度与调度开销。 */
      async function diagBatch(model) {
        const o = await loadOrt();
        log(`\n── 批处理诊断: ${model.name} ──`);
        let session;
        try {
          session = await makeSession(o, model.file, "webgpu");
        } catch (err) {
          log(`  ✗ ${err.message}`);
          return null;
        }

        const tiles = Math.ceil(1920 / model.tile) * Math.ceil(1080 / model.tile);
        const results = [];
        // 重型模型只测到 batch=4：batch=16 × 250ms 会分配巨大的中间张量，
        // 实测会把 WASM 堆撑爆（memory access out of bounds）
        const batches = model.heavy ? [1, 2, 4] : [1, 4, 8, 16];
        for (const batch of batches) {
          if (batch > tiles) break;
          try {
            const feeds = makeFeed(o, session, model, batch);
            await session.run(feeds);       // warmup 该 shape
            // 大 batch 迭代次数减少，避免慢模型把页面挂住太久
            const iters = batch >= 8 ? 3 : 5;
            const { median } = await timeRuns(session, feeds, iters);
            const perTile = median / batch;
            const frameMs = perTile * tiles;
            log(`  batch=${String(batch).padStart(2)}: ${median.toFixed(2)}ms 总 · ` +
                `${perTile.toFixed(2)}ms/块 · 1080p ≈ ${frameMs.toFixed(0)}ms → ` +
                `${(1000/frameMs).toFixed(1)} fps`);
            results.push({ batch, perTile, frameMs });
            // 单次已达数秒时继续加倍 batch 只会更久，结论也不会变
            if (median > 4000) {
              log(`  停止加大 batch —— 单次已超 4s。`);
              break;
            }
          } catch (err) {
            if (err instanceof Aborted) throw err;
            log(`  batch=${batch}: 不支持 — ${err.message.slice(0, 120)}`);
            break;
          }
        }
        await dispose(session);

        if (results.length > 1) {
          const gain = results[0].perTile / results[results.length - 1].perTile;
          log(`  批处理增益: ${gain.toFixed(2)}× (batch=1 → ${results[results.length-1].batch})`);
          if (gain < 1.3) {
            log(`  ⚠ 增益很小 —— 瓶颈不在调度开销，而在实际算力或内存带宽。`);
          }
        } else if (results.length === 1) {
          log(`  ⚠ 仅支持 batch=1（Reshape 常量 shape 把 batch 也钉死了），`);
          log(`    无法通过批处理提升 GPU 利用率。`);
        }
        return results;
      }

      /* ---- 诊断 3: 并行提交 ----
       * 目的：串行逐块 await 会在每块之间插入完整的 JS→GPU→JS 往返，
       * 这里测多路并发能否让 GPU 流水起来。
       *
       * 关键：必须为每路并发建独立 session。同一个 session 并发调用 run()
       * 不是线程安全的 —— 实测会直接死锁（早期版本卡在这一步）。
       */
      async function diagConcurrent(model) {
        const o = await loadOrt();
        log(`\n── 并行提交诊断: ${model.name} ──`);

        // 单次耗时用来推算超时上限，避免再次卡死整个页面
        let unitMs = 0;
        try {
          const s0 = await makeSession(o, model.file, "webgpu");
          const f0 = makeFeed(o, s0, model, 1);
          await s0.run(f0);
          unitMs = (await timeRuns(s0, f0, 3)).median;
          await dispose(s0);
          log(`  基准单次: ${unitMs.toFixed(2)}ms`);
        } catch (err) {
          log(`  ✗ ${err.message}`);
          return null;
        }

        // 单次已经很慢的模型不值得再测并发：多开 session 会成倍拉长等待，
        // 且结论不会改变（250ms/块 × 135 块无论怎么并发都无救）。
        if (unitMs > 80) {
          log(`  跳过并发测试 —— 单次 ${unitMs.toFixed(0)}ms 过慢，并发无法改变结论。`);
          return null;
        }

        for (const par of [2, 4]) {
          // 每路独立 session，避免共享 session 并发死锁
          let sessions = [];
          try {
            for (let i = 0; i < par; i++) {
              sessions.push(await makeSession(o, model.file, "webgpu"));
            }
            const feedsList = sessions.map((s) => makeFeed(o, s, model, 1));
            // 各 session 分别预热，把 shader 编译排除在计时之外
            await Promise.all(sessions.map((s, i) => s.run(feedsList[i])));

            // 超时保护：并发不该比串行慢太多，超了就判定为异常并跳过
            const budget = Math.max(3000, unitMs * par * 6);
            const t = performance.now();
            const work = Promise.all(
              sessions.map((s, i) => s.run(feedsList[i])),
            );
            const timeout = new Promise((_, rej) =>
              setTimeout(() => rej(new Error(`超过 ${budget.toFixed(0)}ms 未完成`)), budget),
            );
            await Promise.race([work, timeout]);
            const total = performance.now() - t;

            const serialEquiv = unitMs * par;
            const gain = serialEquiv / total;
            log(`  ${par} 路并发: 总 ${total.toFixed(2)}ms · ` +
                `${(total / par).toFixed(2)}ms/次 · ` +
                `相对串行 ${serialEquiv.toFixed(0)}ms 增益 ${gain.toFixed(2)}×`);
            if (gain < 1.2) {
              log(`    ⚠ 增益很小 —— GPU 已被单路占满，瓶颈是算力不是调度。`);
            }
          } catch (err) {
            if (err instanceof Aborted) throw err;
            log(`  ${par} 路并发: 失败/超时 — ${err.message.slice(0, 100)}`);
          } finally {
            await dispose(...sessions);
          }
        }
      }

      /* ---- 诊断 4: 与纯 shader 对比 ----
       * 拿本项目实际使用的 EASU shader 处理同等像素量，作为"这块 GPU 在
       * 纯 shader 工作负载下有多快"的参照。CNN 与它的差距即为模型本身
       * 的代价，与 GPU 能力无关。 */
      async function diagShaderBaseline() {
        log(`\n── 纯 shader 参照 (EASU) ──`);
        if (!adapter) { log(`  ✗ 无 WebGPU adapter`); return; }
        if (!device) device = await adapter.requestDevice();

        let code = await (await fetch("../src/easu.wgsl")).text();
        const module = device.createShaderModule({ code });
        const info = await module.getCompilationInfo();
        if (info.messages.some((m) => m.type === "error")) {
          log(`  ✗ easu.wgsl 编译失败`);
          return;
        }

        const FORMAT = "rgba8unorm";
        const pipeline = device.createRenderPipeline({
          layout: "auto",
          vertex: { module, entryPoint: "vs_main" },
          fragment: { module, entryPoint: "fs_main", targets: [{ format: FORMAT }] },
          primitive: { topology: "triangle-list" },
        });
        const sampler = device.createSampler({
          magFilter: "linear", minFilter: "linear",
          addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge",
        });

        for (const [sw, sh, dw, dh, label] of [
          [1920, 1080, 2560, 1440, "1080p → 2K"],
          [1920, 1080, 3840, 2160, "1080p → 4K"],
        ]) {
          const src = device.createTexture({
            size: [sw, sh], format: FORMAT,
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT,
          });
          const dst = device.createTexture({
            size: [dw, dh], format: FORMAT,
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
          });
          const bg = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: src.createView() },
              { binding: 1, resource: sampler },
            ],
          });

          // warmup
          for (let i = 0; i < 3; i++) {
            const e = device.createCommandEncoder();
            const p = e.beginRenderPass({
              colorAttachments: [{
                view: dst.createView(), loadOp: "clear",
                clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: "store",
              }],
            });
            p.setPipeline(pipeline); p.setBindGroup(0, bg); p.draw(3); p.end();
            device.queue.submit([e.finish()]);
          }
          await device.queue.onSubmittedWorkDone();

          const N = 20;
          const t = performance.now();
          for (let i = 0; i < N; i++) {
            const e = device.createCommandEncoder();
            const p = e.beginRenderPass({
              colorAttachments: [{
                view: dst.createView(), loadOp: "clear",
                clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: "store",
              }],
            });
            p.setPipeline(pipeline); p.setBindGroup(0, bg); p.draw(3); p.end();
            device.queue.submit([e.finish()]);
          }
          await device.queue.onSubmittedWorkDone();
          const per = (performance.now() - t) / N;
          log(`  EASU ${label}: ${per.toFixed(2)}ms/帧 → ${(1000/per).toFixed(0)} fps`);
          src.destroy(); dst.destroy();
        }
        log(`  ↑ 这是本项目实际使用的方案，作为同一 GPU 的能力参照。`);
      }

      /* ---- 编排 ---- */
      function judge(results) {
        const good = results.filter((r) => r && !r.error && r.frameMs);
        if (!good.length) { setVerdict("bad", "无有效结果"); return; }
        const best = good.reduce((a, b) => (a.frameMs < b.frameMs ? a : b));
        const fps = 1000 / best.frameMs;
        if (best.frameMs <= BUDGET_60) {
          setVerdict("ok", `可行：${best.model.name} 达 ${fps.toFixed(1)} fps，满足 60fps。`);
        } else if (best.frameMs <= BUDGET_30) {
          setVerdict("warn", `勉强：最优 ${fps.toFixed(1)} fps，够 30fps 但无余量。`);
        } else {
          setVerdict("bad",
            `不可行：最优仅 ${fps.toFixed(1)} fps，距 60fps 需再快 ` +
            `${(best.frameMs / BUDGET_60).toFixed(0)} 倍。EASU 纯 shader 方案更合适。`);
        }
      }

      async function run(mode) {
        const btns = [...document.querySelectorAll("button")]
          .filter((b) => b.id !== "abort");
        const abortBtn = document.getElementById("abort");
        btns.forEach((b) => (b.disabled = true));
        abortBtn.disabled = false;
        aborted = false;
        lines.length = 0;
        log(`开始 — ${new Date().toLocaleTimeString()}  模式: ${mode}`);

        try {
          if (await checkModels()) {
            const results = [];
            const eps = mode === "wasm" ? ["webgpu", "wasm"] : ["webgpu"];
            for (const ep of eps) {
              for (const model of MODELS) {
                checkAbort();
                results.push(await basic(model, ep));
              }
            }
            judge(results);

            if (mode === "full") {
              log(`\n${"═".repeat(56)}`);
              log(`GPU 利用率诊断`);
              log("═".repeat(56));
              for (const model of MODELS) {
                checkAbort();
                await diagFallback(model);
                checkAbort();
                await diagBatch(model);
                checkAbort();
                await diagConcurrent(model);
              }
              checkAbort();
              await diagShaderBaseline();
            }
          }
          log(`\n完成。`);
        } catch (err) {
          if (err instanceof Aborted) {
            log(`\n已中止。上面的结果仍然有效。`);
          } else {
            log(`\n✗ 出错: ${err.message}`);
            log(err.stack || "");
          }
        } finally {
          btns.forEach((b) => (b.disabled = false));
          abortBtn.disabled = true;
        }
      }

      document.getElementById("run").addEventListener("click", () => run("basic"));
      document.getElementById("runFull").addEventListener("click", () => run("full"));
      document.getElementById("runWasm").addEventListener("click", () => run("wasm"));
      document.getElementById("abort").addEventListener("click", () => {
        aborted = true;
        log(`\n中止请求已发出，等待当前推理返回…`);
      });
    </script>
  </body>
</html>
