<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>VidSharp shader tests</title></head>
  <body>
    <pre id="result">running</pre>
    <script type="module">
      const log = [];
      const fail = (m) => log.push("FAIL: " + m);
      const ok = (m) => log.push("ok: " + m);
      const finish = (status) => {
        document.getElementById("result").textContent =
          JSON.stringify({ status, log }, null, 2);
        window.__done = { status, log };
      };

      try {
        if (!navigator.gpu) throw new Error("no navigator.gpu");
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("no adapter");
        const device = await adapter.requestDevice();
        device.addEventListener?.("uncapturederror", (e) =>
          fail("uncaptured: " + e.error.message));

        // 生产 shader 用 texture_external（只能绑真实视频帧），测试里换成
        // texture_2d 以便注入已知像素。数学部分逐字不变。
        async function loadShader(name, swapExternal) {
          let code = await (await fetch(`../src/${name}.wgsl`)).text();
          if (swapExternal) {
            const before = code;
            code = code
              .replace("var srcTex: texture_external;", "var srcTex: texture_2d<f32>;")
              .replace(
                /textureSampleBaseClampToEdge\(srcTex, srcSampler, ([^)]+)\)/g,
                "textureSampleLevel(srcTex, srcSampler, $1, 0.0)",
              );
            if (code === before) throw new Error(`${name}: external 替换失败`);
          }
          return code;
        }

        const SAMPLER = device.createSampler({
          magFilter: "linear", minFilter: "linear",
          addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge",
        });
        const FORMAT = "rgba8unorm";

        async function compile(name, swapExternal) {
          const code = await loadShader(name, swapExternal);
          const module = device.createShaderModule({ code });
          const info = await module.getCompilationInfo();
          const errors = info.messages.filter((m) => m.type === "error");
          if (errors.length) {
            for (const m of errors) fail(`${name}.wgsl ${m.lineNum}:${m.linePos} ${m.message}`);
            return null;
          }
          ok(`${name}.wgsl 编译通过`);
          return module;
        }

        function makeTexture(w, h, pixels) {
          const tex = device.createTexture({
            size: [w, h], format: FORMAT,
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
                 | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
          });
          if (pixels) {
            device.queue.writeTexture({ texture: tex }, pixels,
              { bytesPerRow: w * 4 }, [w, h]);
          }
          return tex;
        }

        async function readback(tex, w, h) {
          const bytesPerRow = Math.ceil(w * 4 / 256) * 256;
          const buf = device.createBuffer({
            size: bytesPerRow * h,
            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
          });
          const enc = device.createCommandEncoder();
          enc.copyTextureToBuffer({ texture: tex },
            { buffer: buf, bytesPerRow }, [w, h]);
          device.queue.submit([enc.finish()]);
          await buf.mapAsync(GPUMapMode.READ);
          const raw = new Uint8Array(buf.getMappedRange()).slice();
          buf.unmap();
          return (x, y) => {
            const o = y * bytesPerRow + x * 4;
            return [raw[o], raw[o + 1], raw[o + 2]];
          };
        }

        function runPass(module, srcTex, dstTex, dstW, dstH, uniforms) {
          const pipeline = device.createRenderPipeline({
            layout: "auto",
            vertex: { module, entryPoint: "vs_main" },
            fragment: { module, entryPoint: "fs_main", targets: [{ format: FORMAT }] },
            primitive: { topology: "triangle-list" },
          });
          const entries = [
            { binding: 0, resource: srcTex.createView() },
            { binding: 1, resource: SAMPLER },
          ];
          if (uniforms) {
            const ub = device.createBuffer({
              size: 16,
              usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(ub, 0, new Float32Array(uniforms));
            entries.push({ binding: 2, resource: { buffer: ub } });
          }
          const enc = device.createCommandEncoder();
          const pass = enc.beginRenderPass({
            colorAttachments: [{
              view: dstTex.createView(),
              loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 1 },
              storeOp: "store",
            }],
          });
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0), entries,
          }));
          pass.draw(3);
          pass.end();
          device.queue.submit([enc.finish()]);
        }

        /* ======== 编译全部 shader ======== */
        const mEnhance = await compile("enhance", true);
        const mEasu = await compile("easu", false);
        const mRcas = await compile("rcas", false);
        const mGrain = await compile("grain", false);
        const mBadge = await compile("badge", false);
        const mRavu = await compile("ravu", false);
        if (!mEnhance || !mEasu || !mRcas || !mGrain || !mBadge || !mRavu) {
          finish("shader-compile-error");
          throw new Error("__handled__");
        }

        /* ======== 测试图 ======== */
        const S = 16;
        // 竖直边缘 + 一条 45 度斜边（用于验证 EASU 的方向自适应）
        const edgePixels = new Uint8Array(S * S * 4);
        for (let y = 0; y < S; y++) {
          for (let x = 0; x < S; x++) {
            const i = (y * S + x) * 4;
            const v = x + y < S ? 40 : 210;
            edgePixels[i] = edgePixels[i + 1] = edgePixels[i + 2] = v;
            edgePixels[i + 3] = 255;
          }
        }
        const edgeTex = makeTexture(S, S, edgePixels);

        /* ======== EASU: 放大正确性 ======== */
        const UP = S * 2;
        const upTex = makeTexture(UP, UP, null);
        runPass(mEasu, edgeTex, upTex, UP, UP, null);
        const up = await readback(upTex, UP, UP);

        // 斜边两侧的极值应当被保留（不因插值丢失动态范围）
        const corner0 = up(1, 1)[0];        // 深色侧
        const cornerFar = up(UP - 2, UP - 2)[0]; // 亮色侧
        if (corner0 < 70 && cornerFar > 180) {
          ok(`EASU 保留动态范围 (暗${corner0} 亮${cornerFar})`);
        } else {
          fail(`EASU 动态范围丢失: 暗${corner0}(期望<70) 亮${cornerFar}(期望>180)`);
        }

        // 放大后不应出现越界或全黑
        let easuAllSame = true;
        const first = up(0, 0)[0];
        for (let y = 0; y < UP; y += 3) {
          for (let x = 0; x < UP; x += 3) {
            if (up(x, y)[0] !== first) easuAllSame = false;
          }
        }
        if (!easuAllSame) ok("EASU 输出有空间变化");
        else fail("EASU 输出为纯色，采样失效");

        // 斜边应当平滑过渡：沿垂直于边缘方向取样，中间值应介于两端之间
        const mid = up(UP / 2, UP / 2)[0];
        if (mid > corner0 && mid < cornerFar) {
          ok(`EASU 斜边过渡单调 (${corner0} < ${mid} < ${cornerFar})`);
        } else {
          fail(`EASU 斜边过渡异常: 中间值 ${mid} 未介于 ${corner0}~${cornerFar}`);
        }

        /* ======== enhance: 全部关闭时应恒等 ======== */
        const idTex = makeTexture(S, S, null);
        runPass(mEnhance, edgeTex, idTex, S, S, [0, 0, 0, 0]);
        const idRead = await readback(idTex, S, S);
        // 取远离块边界与斜边的点
        const idSample = idRead(3, 12)[0];
        const expected = 3 + 12 < S ? 40 : 210;
        if (Math.abs(idSample - expected) <= 2) {
          ok(`enhance 全关时恒等 (${idSample} ≈ ${expected})`);
        } else {
          fail(`enhance 全关时改动了画面: ${idSample}, 期望 ${expected}`);
        }

        /* ======== enhance: 平坦区不被去块破坏 ======== */
        const flatPixels = new Uint8Array(S * S * 4).fill(255);
        for (let i = 0; i < S * S; i++) {
          flatPixels[i * 4] = flatPixels[i * 4 + 1] = flatPixels[i * 4 + 2] = 128;
        }
        const flatTex = makeTexture(S, S, flatPixels);
        const flatOut = makeTexture(S, S, null);
        // 去块与对比度全开，去色带关闭（它会故意加抖动）
        runPass(mEnhance, flatTex, flatOut, S, S, [1, 0, 1, 0]);
        const flatRead = await readback(flatOut, S, S);
        let flatMaxDev = 0;
        for (let y = 1; y < S - 1; y++) {
          for (let x = 1; x < S - 1; x++) {
            flatMaxDev = Math.max(flatMaxDev, Math.abs(flatRead(x, y)[0] - 128));
          }
        }
        if (flatMaxDev <= 2) {
          ok(`enhance 纯色区稳定 (最大偏差 ${flatMaxDev})`);
        } else {
          fail(`enhance 破坏了纯色区: 最大偏差 ${flatMaxDev}`);
        }

        /* ======== enhance: 去色带只在渐变区起作用 ======== */
        // 纯色区 range 恰为 0，代码中 isFlat 要求 range > 0，故不应加抖动
        const debandOut = makeTexture(S, S, null);
        runPass(mEnhance, flatTex, debandOut, S, S, [0, 1, 0, 7]);
        const debandRead = await readback(debandOut, S, S);
        let debandDev = 0;
        for (let y = 1; y < S - 1; y++) {
          for (let x = 1; x < S - 1; x++) {
            debandDev = Math.max(debandDev, Math.abs(debandRead(x, y)[0] - 128));
          }
        }
        if (debandDev <= 2) {
          ok(`去色带未污染纯色区 (最大偏差 ${debandDev})`);
        } else {
          fail(`去色带在纯色区加了噪声: 偏差 ${debandDev}`);
        }

        /* ======== RCAS: 沿用原有验证 ======== */
        const rcasIn = makeTexture(S, S, edgePixels);
        const rcasOut = makeTexture(S, S, null);

        runPass(mRcas, rcasIn, rcasOut, S, S, [0, 0, 0, 0]);
        const r0 = await readback(rcasOut, S, S);
        const r0v = r0(3, 12)[0];
        if (Math.abs(r0v - expected) <= 2) {
          ok(`RCAS sharpness=0 恒等 (${r0v})`);
        } else {
          fail(`RCAS sharpness=0 未恒等: ${r0v}, 期望 ${expected}`);
        }

        const rcasOut2 = makeTexture(S, S, null);
        runPass(mRcas, rcasIn, rcasOut2, S, S, [1, 0, 0, 0]);
        const r1 = await readback(rcasOut2, S, S);

        // 跨斜边取相邻两点，锐化后对比不应降低
        const a0 = r0(7, 8)[0], b0 = r0(8, 8)[0];
        const a1 = r1(7, 8)[0], b1 = r1(8, 8)[0];
        if (Math.abs(b1 - a1) >= Math.abs(b0 - a0)) {
          ok(`RCAS 边缘对比未降低 (${Math.abs(b0 - a0)} → ${Math.abs(b1 - a1)})`);
        } else {
          fail(`RCAS 边缘对比下降: ${Math.abs(b0 - a0)} → ${Math.abs(b1 - a1)}`);
        }

        // 强度单调性（上一版 exp2 映射错误的回归测试）
        const map = (s) => Math.max(0, Math.min(1, s / 100));
        if (map(0) === 0 && map(100) === 1) {
          ok("强度映射端点正确 (0→0, 100→1)");
        } else {
          fail(`强度映射端点错误: 0→${map(0)}, 100→${map(100)}`);
        }

        /* ======== badge: 合成正确性 ========
         * 关键性质：角标矩形外的像素必须逐位不变（否则会污染整幅画面）；
         * 矩形内必须真的被改变（否则角标不可见，失去指示意义）。 */
        {
          const bw = 8, bh = 4;
          // 角标纹理：全不透明的纯红
          const badgePixels = new Uint8Array(bw * bh * 4);
          for (let i = 0; i < bw * bh; i++) {
            badgePixels[i * 4] = 255;
            badgePixels[i * 4 + 3] = 255;
          }
          const badgeTex = makeTexture(bw, bh, badgePixels);

          // 底图：均匀灰
          const grayPixels = new Uint8Array(S * S * 4);
          for (let i = 0; i < S * S; i++) {
            grayPixels[i * 4] = grayPixels[i * 4 + 1] = grayPixels[i * 4 + 2] = 100;
            grayPixels[i * 4 + 3] = 255;
          }
          const baseTex = makeTexture(S, S, grayPixels);
          const dst = makeTexture(S, S, null);

          // 角标置于右上角：x=0.5, y=0, w=0.5, h=0.25 → 覆盖 x∈[8,16), y∈[0,4)
          const ub = device.createBuffer({
            size: 32,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
          });
          device.queue.writeBuffer(ub, 0, new Float32Array([
            0.5, 0.0, 0.5, 0.25,
            1.0, 0, 0, 0,
          ]));

          const pipeline = device.createRenderPipeline({
            layout: "auto",
            vertex: { module: mBadge, entryPoint: "vs_main" },
            fragment: { module: mBadge, entryPoint: "fs_main", targets: [{ format: FORMAT }] },
            primitive: { topology: "triangle-list" },
          });
          const enc = device.createCommandEncoder();
          const pass = enc.beginRenderPass({
            colorAttachments: [{
              view: dst.createView(),
              loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 1 },
              storeOp: "store",
            }],
          });
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: baseTex.createView() },
              { binding: 1, resource: SAMPLER },
              { binding: 2, resource: badgeTex.createView() },
              { binding: 3, resource: { buffer: ub } },
            ],
          }));
          pass.draw(3);
          pass.end();
          device.queue.submit([enc.finish()]);

          const bg = await readback(dst, S, S);

          // 矩形内应变红
          const inside = bg(12, 2);
          if (inside[0] > 200 && inside[1] < 60) {
            ok(`badge 矩形内已合成 (rgb ${inside.join(",")})`);
          } else {
            fail(`badge 矩形内未合成: rgb ${inside.join(",")}, 期望偏红`);
          }

          // 矩形外必须完全不变
          let outsideMaxDev = 0;
          const probes = [[2, 2], [4, 10], [12, 10], [1, 15], [15, 15]];
          for (const [x, y] of probes) {
            const p = bg(x, y);
            outsideMaxDev = Math.max(outsideMaxDev,
              Math.abs(p[0] - 100), Math.abs(p[1] - 100), Math.abs(p[2] - 100));
          }
          if (outsideMaxDev <= 2) {
            ok(`badge 矩形外未受影响 (最大偏差 ${outsideMaxDev})`);
          } else {
            fail(`badge 污染了矩形外区域: 最大偏差 ${outsideMaxDev}`);
          }

          // opacity=0 时应完全等于底图
          const dst2 = makeTexture(S, S, null);
          device.queue.writeBuffer(ub, 0, new Float32Array([
            0.5, 0.0, 0.5, 0.25, 0.0, 0, 0, 0,
          ]));
          const enc2 = device.createCommandEncoder();
          const pass2 = enc2.beginRenderPass({
            colorAttachments: [{
              view: dst2.createView(),
              loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 1 },
              storeOp: "store",
            }],
          });
          pass2.setPipeline(pipeline);
          pass2.setBindGroup(0, device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: baseTex.createView() },
              { binding: 1, resource: SAMPLER },
              { binding: 2, resource: badgeTex.createView() },
              { binding: 3, resource: { buffer: ub } },
            ],
          }));
          pass2.draw(3);
          pass2.end();
          device.queue.submit([enc2.finish()]);
          const bg2 = await readback(dst2, S, S);
          const zeroOp = bg2(12, 2);
          if (Math.abs(zeroOp[0] - 100) <= 2) {
            ok(`badge opacity=0 时恒等 (${zeroOp[0]})`);
          } else {
            fail(`badge opacity=0 仍改变了画面: ${zeroOp[0]}`);
          }
        }

        /* ======== grain: 合成颗粒 ========
         * 三个关键性质：strength=0 恒等；纯黑/纯白不加颗粒（否则显脏）；
         * 中间调确实加了颗粒（否则功能无效）。 */
        {
          const mkPipe = () => device.createRenderPipeline({
            layout: "auto",
            vertex: { module: mGrain, entryPoint: "vs_main" },
            fragment: { module: mGrain, entryPoint: "fs_main", targets: [{ format: FORMAT }] },
            primitive: { topology: "triangle-list" },
          });
          const pipe = mkPipe();

          async function grainRun(level, strength) {
            const px = new Uint8Array(S * S * 4);
            for (let i = 0; i < S * S; i++) {
              px[i*4] = px[i*4+1] = px[i*4+2] = level;
              px[i*4+3] = 255;
            }
            const src = makeTexture(S, S, px);
            const dst = makeTexture(S, S, null);
            const ub = device.createBuffer({
              size: 16,
              usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            // strength, size, frameSeed, chroma
            device.queue.writeBuffer(ub, 0, new Float32Array([strength, 1, 7, 0]));
            const enc = device.createCommandEncoder();
            const pass = enc.beginRenderPass({
              colorAttachments: [{
                view: dst.createView(), loadOp: "clear",
                clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: "store",
              }],
            });
            pass.setPipeline(pipe);
            pass.setBindGroup(0, device.createBindGroup({
              layout: pipe.getBindGroupLayout(0),
              entries: [
                { binding: 0, resource: src.createView() },
                { binding: 1, resource: SAMPLER },
                { binding: 2, resource: { buffer: ub } },
              ],
            }));
            pass.draw(3);
            pass.end();
            device.queue.submit([enc.finish()]);
            const rd = await readback(dst, S, S);
            let maxDev = 0, varied = 0;
            for (let y = 2; y < S - 2; y++) {
              for (let x = 2; x < S - 2; x++) {
                const d = Math.abs(rd(x, y)[0] - level);
                maxDev = Math.max(maxDev, d);
                if (d > 0) varied++;
              }
            }
            return { maxDev, varied };
          }

          // strength=0 必须恒等
          const off = await grainRun(128, 0.0);
          if (off.maxDev === 0) {
            ok(`grain strength=0 恒等`);
          } else {
            fail(`grain strength=0 仍改变画面: 偏差 ${off.maxDev}`);
          }

          // 中间调应当有颗粒
          const mid = await grainRun(110, 1.0);
          if (mid.varied > 0) {
            ok(`grain 中间调有颗粒 (${mid.varied} 像素变化, 最大 ±${mid.maxDev})`);
          } else {
            fail(`grain 中间调未生效`);
          }

          // 幅度必须温和 —— 基础 3/255 加权后不应超过约 5 个量化级
          if (mid.maxDev <= 6) {
            ok(`grain 幅度温和 (最大 ±${mid.maxDev} ≤ 6)`);
          } else {
            fail(`grain 幅度过大: ±${mid.maxDev}，会显噪点`);
          }

          // 纯黑不加（shadowGuard）
          const black = await grainRun(2, 1.0);
          if (black.maxDev <= 1) {
            ok(`grain 纯黑区不加颗粒 (偏差 ${black.maxDev})`);
          } else {
            fail(`grain 污染纯黑区: 偏差 ${black.maxDev}，会显脏`);
          }

          // 高光不加（highlightGuard）
          const white = await grainRun(252, 1.0);
          if (white.maxDev <= 1) {
            ok(`grain 高光区不加颗粒 (偏差 ${white.maxDev})`);
          } else {
            fail(`grain 污染高光区: 偏差 ${white.maxDev}`);
          }
        }

        /* ======== RAVU: LUT 查表放大 ========
         * 用真实 LUT 数据验证：输出有空间变化、动态范围不塌、无 NaN。
         * RAVU 只调整亮度，故重点看灰度斜边是否被正确重建。 */
        {
          const { RAVU_LUT } = await import("../src/data/ravu-lut.js");
          const bin = Uint8Array.from(atob(RAVU_LUT.data), (c) => c.charCodeAt(0));
          const expected = RAVU_LUT.width * RAVU_LUT.height * 4 * 2; // rgba fp16
          if (bin.length === expected) {
            ok(`RAVU LUT 尺寸正确 (${RAVU_LUT.width}×${RAVU_LUT.height}, ${bin.length}B)`);
          } else {
            fail(`RAVU LUT 尺寸错误: ${bin.length}B, 期望 ${expected}B`);
          }

          const lutTex = device.createTexture({
            size: [RAVU_LUT.width, RAVU_LUT.height],
            format: "rgba16float",
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
          });
          device.queue.writeTexture(
            { texture: lutTex }, bin,
            { bytesPerRow: RAVU_LUT.width * 8 },
            [RAVU_LUT.width, RAVU_LUT.height],
          );

          const UP = S * 2;
          const dst = device.createTexture({
            size: [UP, UP], format: FORMAT,
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC
                 | GPUTextureUsage.TEXTURE_BINDING,
          });
          const pipe = device.createRenderPipeline({
            layout: "auto",
            vertex: { module: mRavu, entryPoint: "vs_main" },
            fragment: { module: mRavu, entryPoint: "fs_main", targets: [{ format: FORMAT }] },
            primitive: { topology: "triangle-list" },
          });
          const enc = device.createCommandEncoder();
          const pass = enc.beginRenderPass({
            colorAttachments: [{
              view: dst.createView(), loadOp: "clear",
              clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: "store",
            }],
          });
          pass.setPipeline(pipe);
          pass.setBindGroup(0, device.createBindGroup({
            layout: pipe.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: edgeTex.createView() },
              { binding: 1, resource: SAMPLER },
              { binding: 2, resource: lutTex.createView() },
            ],
          }));
          pass.draw(3);
          pass.end();
          device.queue.submit([enc.finish()]);

          const rd = await readback(dst, UP, UP);

          // 动态范围：斜边两侧应仍分得开
          const dark = rd(2, 2)[0];
          const bright = rd(UP - 3, UP - 3)[0];
          if (dark < 90 && bright > 160) {
            ok(`RAVU 保留动态范围 (暗${dark} 亮${bright})`);
          } else {
            fail(`RAVU 动态范围异常: 暗${dark}(期望<90) 亮${bright}(期望>160)`);
          }

          // 平坦区保真：远离边缘处不应偏离输入太多。
          // 输入是 40/210 两级，容差取 ±12（RAVU 会锐化，但平坦区不该大改）。
          // 这条能抓住"整体亮度被 LUT 拉偏"或"暗部被压成纯黑"这类移植错误。
          let flatErr = 0;
          for (const [x, y, want] of [[1, 1, 40], [3, 1, 40], [UP-2, UP-2, 210], [UP-4, UP-2, 210]]) {
            flatErr = Math.max(flatErr, Math.abs(rd(x, y)[0] - want));
          }
          if (flatErr <= 12) {
            ok(`RAVU 平坦区保真 (最大偏差 ${flatErr})`);
          } else {
            fail(`RAVU 平坦区偏离过大: ${flatErr} —— 检查 LUT 布局/子像素索引`);
          }

          // 空间变化（未退化为纯色，也未全黑）
          let distinct = new Set();
          for (let y = 0; y < UP; y += 2) {
            for (let x = 0; x < UP; x += 2) distinct.add(rd(x, y)[0]);
          }
          if (distinct.size >= 3) {
            ok(`RAVU 输出有空间变化 (${distinct.size} 个不同灰阶)`);
          } else {
            fail(`RAVU 输出近似纯色 (仅 ${distinct.size} 个灰阶)`);
          }

          // 灰度输入应保持中性（RAVU 只动亮度，不该引入偏色）
          let maxTint = 0;
          for (let y = 2; y < UP - 2; y += 3) {
            for (let x = 2; x < UP - 2; x += 3) {
              const p = rd(x, y);
              maxTint = Math.max(maxTint, Math.abs(p[0] - p[1]), Math.abs(p[1] - p[2]));
            }
          }
          if (maxTint <= 2) {
            ok(`RAVU 灰度输入无偏色 (最大通道差 ${maxTint})`);
          } else {
            fail(`RAVU 引入偏色: 最大通道差 ${maxTint}`);
          }
        }

        /* ======== 输出尺寸计算（纯逻辑回归） ======== */
        const UPSCALE_TARGETS = { "2k": 2560, "4k": 3840 };
        function computeOutputSize(vw, vh, mode, maxDim) {
          if (mode === "off" || !vw || !vh) return { w: vw, h: vh };
          let scale;
          if (mode === "2x") scale = 2;
          else {
            const t = UPSCALE_TARGETS[mode];
            if (!t) return { w: vw, h: vh };
            if (vw >= t) return { w: vw, h: vh };
            scale = t / vw;
          }
          scale = Math.min(scale, Math.min(maxDim / vw, maxDim / vh));
          if (scale <= 1) return { w: vw, h: vh };
          return { w: Math.round(vw * scale), h: Math.round(vh * scale) };
        }

        const M1_MAX = 8192;
        const cases = [
          [[1920, 1080, "2k", M1_MAX], [2560, 1440], "1080p→2K"],
          [[1280, 720, "2k", M1_MAX], [2560, 1440], "720p→2K"],
          [[1920, 1080, "4k", M1_MAX], [3840, 2160], "1080p→4K"],
          [[2560, 1440, "2k", M1_MAX], [2560, 1440], "已达2K不放大"],
          [[3840, 2160, "2k", M1_MAX], [3840, 2160], "4K源不缩小"],
          [[1920, 1080, "off", M1_MAX], [1920, 1080], "关闭时原尺寸"],
          [[1920, 1080, "2x", M1_MAX], [3840, 2160], "2倍放大"],
          // 4K 源 2x = 7680x4320，仍在 8192 限制内，应正常放大
          [[3840, 2160, "2x", M1_MAX], [7680, 4320], "4K源2倍仍在上限内"],
          // 5K 源 2x 会超限，scale 被钳到 8192/5120=1.6
          [[5120, 2880, "2x", M1_MAX], [8192, 4608], "超纹理上限时钳制"],
        ];
        let sizeOk = true;
        for (const [args, want, name] of cases) {
          const got = computeOutputSize(...args);
          if (got.w !== want[0] || got.h !== want[1]) {
            fail(`尺寸计算 ${name}: 得到 ${got.w}x${got.h}, 期望 ${want[0]}x${want[1]}`);
            sizeOk = false;
          }
        }
        if (sizeOk) ok(`尺寸计算全部正确 (${cases.length} 例)`);

        /* ======== 角标文案生成（纯逻辑） ========
         * 角标是纯 JS 逻辑，shader 测试覆盖不到 —— 上一版的强度映射错误
         * 正是这么漏掉的，所以这里补上。 */
        function badgeText(mode, src, out, s) {
          if (mode === "off") return null;
          const upscaled = out.w > src.w;
          if (mode === "detail") {
            const size = upscaled
              ? `${src.w}×${src.h} → ${out.w}×${out.h}`
              : `${out.w}×${out.h}`;
            const fx = [];
            if (upscaled) {
              const scaleX = out.w / Math.max(1, src.w);
              const ravuActive = s.upscaler === "ravu" && Math.abs(scaleX - 2) < 0.02;
              fx.push(ravuActive ? "RAVU" : "EASU");
            }
            if (s.strength > 0) fx.push(`锐化 ${s.strength}`);
            if (s.deblock > 0) fx.push(`去块 ${s.deblock}`);
            if (s.deband > 0) fx.push(`去色带 ${s.deband}`);
            if (s.contrast > 0) fx.push(`对比 ${s.contrast}`);
            return `VidSharp · ${size}${fx.length ? " · " + fx.join(" / ") : ""}`;
          }
          return upscaled ? `VidSharp ${out.h}p` : "VidSharp";
        }

        const FULL = { strength: 50, deblock: 40, deband: 30, contrast: 25, upscaler: "easu" };
        const ZERO = { strength: 0, deblock: 0, deband: 0, contrast: 0, upscaler: "easu" };
        const RAVU2X = { strength: 50, deblock: 0, deband: 0, contrast: 0, upscaler: "ravu" };
        const badgeCases = [
          ["off", { w: 1920, h: 1080 }, { w: 2560, h: 1440 }, FULL, null, "关闭时无角标"],
          ["corner", { w: 1920, h: 1080 }, { w: 2560, h: 1440 }, FULL,
            "VidSharp 1440p", "简洁模式显示目标高度"],
          ["corner", { w: 1920, h: 1080 }, { w: 1920, h: 1080 }, FULL,
            "VidSharp", "未放大时不显示分辨率"],
          ["detail", { w: 1280, h: 720 }, { w: 2560, h: 1440 }, FULL,
            "VidSharp · 1280×720 → 2560×1440 · EASU / 锐化 50 / 去块 40 / 去色带 30 / 对比 25",
            "详细模式含放大器与全部效果"],
          ["detail", { w: 960, h: 540 }, { w: 1920, h: 1080 }, RAVU2X,
            "VidSharp · 960×540 → 1920×1080 · RAVU / 锐化 50",
            "2x 时 RAVU 生效"],
          ["detail", { w: 1280, h: 720 }, { w: 2560, h: 1440 }, RAVU2X,
            "VidSharp · 1280×720 → 2560×1440 · RAVU / 锐化 50",
            "720p→2K 恰为 2x, RAVU 生效"],
          ["detail", { w: 1920, h: 1080 }, { w: 1920, h: 1080 }, ZERO,
            "VidSharp · 1920×1080", "全部效果关闭时只显示分辨率"],
        ];
        let badgeOk = true;
        for (const [mode, src, out, s, want, name] of badgeCases) {
          const got = badgeText(mode, src, out, s);
          if (got !== want) {
            fail(`角标 ${name}: 得到 ${JSON.stringify(got)}, 期望 ${JSON.stringify(want)}`);
            badgeOk = false;
          }
        }
        if (badgeOk) ok(`角标文案全部正确 (${badgeCases.length} 例)`);

        finish(log.some((l) => l.startsWith("FAIL")) ? "failed" : "passed");
      } catch (err) {
        if (err.message !== "__handled__") {
          fail(err.message);
          finish("error");
        }
      }
    </script>
  </body>
</html>
