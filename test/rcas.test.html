<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>RCAS test</title></head>
  <body>
    <div id="result">running</div>
    <script type="module">
      const log = [];
      const fail = (m) => { log.push("FAIL: " + m); };
      const ok = (m) => { log.push("ok: " + m); };

      function finish(status) {
        document.getElementById("result").textContent =
          JSON.stringify({ status, log }, null, 2);
        window.__done = { status, log };
      }

      try {
        if (!navigator.gpu) throw new Error("no navigator.gpu");
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("no adapter");
        const device = await adapter.requestDevice();
        device.addEventListener?.("uncapturederror", (e) =>
          fail("uncaptured: " + e.error.message));

        // 取真实 shader，把 external texture 换成普通 2D 纹理以便注入测试像素。
        // 数学部分（限幅/噪声抑制/合成）保持逐字不变。
        let code = await (await fetch("../src/rcas.wgsl")).text();
        const original = code;
        code = code
          .replace("var srcTex: texture_external;", "var srcTex: texture_2d<f32>;")
          .replace(
            "return textureSampleBaseClampToEdge(srcTex, srcSampler, uv).rgb;",
            "return textureSampleLevel(srcTex, srcSampler, uv, 0.0).rgb;"
          );
        if (code === original) throw new Error("shader 替换失败，测试无效");

        const module = device.createShaderModule({ code });
        const info = await module.getCompilationInfo();
        for (const m of info.messages) {
          if (m.type === "error") fail(`WGSL ${m.lineNum}:${m.linePos} ${m.message}`);
        }
        if (info.messages.some((m) => m.type === "error")) {
          finish("shader-compile-error");
          throw new Error("__handled__");
        }
        ok("WGSL 编译通过");

        const SIZE = 8;
        const format = "rgba8unorm";

        // 测试图：左半黑右半白的竖直边缘 + 中间一个孤立亮点(模拟噪点)
        const pixels = new Uint8Array(SIZE * SIZE * 4);
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            const i = (y * SIZE + x) * 4;
            const v = x < SIZE / 2 ? 40 : 200;
            pixels[i] = pixels[i + 1] = pixels[i + 2] = v;
            pixels[i + 3] = 255;
          }
        }

        const srcTex = device.createTexture({
          size: [SIZE, SIZE], format,
          usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
        });
        device.queue.writeTexture({ texture: srcTex }, pixels,
          { bytesPerRow: SIZE * 4 }, [SIZE, SIZE]);

        const dstTex = device.createTexture({
          size: [SIZE, SIZE], format,
          usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
        });

        const sampler = device.createSampler({
          magFilter: "linear", minFilter: "linear",
          addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge",
        });

        const pipeline = device.createRenderPipeline({
          layout: "auto",
          vertex: { module, entryPoint: "vs_main" },
          fragment: { module, entryPoint: "fs_main", targets: [{ format }] },
          primitive: { topology: "triangle-list" },
        });

        async function render(sharpness, denoise) {
          const ub = device.createBuffer({
            size: 16,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
          });
          device.queue.writeBuffer(ub, 0,
            new Float32Array([sharpness, denoise ? 1 : 0, 0, 0]));

          const bg = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: srcTex.createView() },
              { binding: 1, resource: sampler },
              { binding: 2, resource: { buffer: ub } },
            ],
          });

          const enc = device.createCommandEncoder();
          const pass = enc.beginRenderPass({
            colorAttachments: [{
              view: dstTex.createView(),
              loadOp: "clear", clearValue: { r: 0, g: 0, b: 0, a: 1 },
              storeOp: "store",
            }],
          });
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, bg);
          pass.draw(3);
          pass.end();

          const bytesPerRow = 256; // WebGPU 要求 256 对齐
          const rb = device.createBuffer({
            size: bytesPerRow * SIZE,
            usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
          });
          enc.copyTextureToBuffer({ texture: dstTex },
            { buffer: rb, bytesPerRow }, [SIZE, SIZE]);
          device.queue.submit([enc.finish()]);

          await rb.mapAsync(GPUMapMode.READ);
          const raw = new Uint8Array(rb.getMappedRange()).slice();
          rb.unmap();

          const rows = [];
          for (let y = 0; y < SIZE; y++) {
            rows.push(Array.from(raw.subarray(y * bytesPerRow, y * bytesPerRow + SIZE * 4)));
          }
          return rows;
        }

        // --- 测试 1: sharpness=0 应当近似恒等（RCAS 特性：lobe=0 → 输出=输入）
        const identity = await render(0.0, false);
        const midRow = identity[4];
        const px = (row, x) => row.slice(x * 4, x * 4 + 3);
        const near = (a, b, tol) => Math.abs(a - b) <= tol;

        const leftId = px(midRow, 1)[0];
        const rightId = px(midRow, 6)[0];
        if (near(leftId, 40, 2) && near(rightId, 200, 2)) {
          ok(`sharpness=0 近似恒等 (左${leftId} 右${rightId})`);
        } else {
          fail(`sharpness=0 未恒等: 左${leftId}(期望40) 右${rightId}(期望200)`);
        }

        // --- 测试 2: 锐化后边缘对比应当增强，且不越界
        const sharp = await render(1.0, false);
        const sRow = sharp[4];
        const sLeft = px(sRow, 3)[0];   // 边缘左侧
        const sRight = px(sRow, 4)[0];  // 边缘右侧
        const iLeft = px(midRow, 3)[0];
        const iRight = px(midRow, 4)[0];
        const contrastBefore = iRight - iLeft;
        const contrastAfter = sRight - sLeft;

        if (contrastAfter >= contrastBefore) {
          ok(`边缘对比未降低 (${contrastBefore} → ${contrastAfter})`);
        } else {
          fail(`边缘对比反而下降: ${contrastBefore} → ${contrastAfter}`);
        }

        // --- 测试 3: 全图不得出现 NaN/越界（uint8 天然限幅，检查是否有异常全黑）
        let allZero = true, hasVariation = false;
        for (const row of sharp) {
          for (let x = 0; x < SIZE; x++) {
            const v = px(row, x)[0];
            if (v !== 0) allZero = false;
            if (v !== px(sharp[4], 0)[0]) hasVariation = true;
          }
        }
        if (allZero) fail("输出全黑，shader 逻辑有误");
        else ok("输出非全黑");
        if (hasVariation) ok("输出有空间变化");
        else fail("输出为纯色，采样可能失效");

        // --- 测试 4: 平坦区不应被改动（纯色区 range≈0，兜底除法不得产生 NaN）
        const flatBefore = px(midRow, 0)[0];
        const flatAfter = px(sRow, 0)[0];
        if (near(flatBefore, flatAfter, 3)) {
          ok(`平坦区稳定 (${flatBefore} → ${flatAfter})`);
        } else {
          fail(`平坦区被异常改动: ${flatBefore} → ${flatAfter}`);
        }

        // --- 测试 5: 噪声抑制开启后锐化量应当 <= 关闭时
        const denoised = await render(1.0, true);
        const dContrast = px(denoised[4], 4)[0] - px(denoised[4], 3)[0];
        if (dContrast <= contrastAfter + 1) {
          ok(`噪声抑制生效 (对比 ${contrastAfter} → ${dContrast})`);
        } else {
          fail(`噪声抑制反而增强了锐化: ${contrastAfter} → ${dContrast}`);
        }

        // --- 测试 6: 强度单调性
        // 上一版把面板值映射成 exp2(-stops)，导致 strength=0 时 sharpness 仍为
        // 0.25、整个区间被压在弱效果段。这里直接验证映射端点与单调性。
        const strengthToSharpness = (s) => Math.max(0, Math.min(1, s / 100));
        if (strengthToSharpness(0) === 0 && strengthToSharpness(100) === 1) {
          ok("强度映射端点正确 (0→0, 100→1)");
        } else {
          fail(
            `强度映射端点错误: 0→${strengthToSharpness(0)}, ` +
            `100→${strengthToSharpness(100)}`
          );
        }

        const weak = await render(strengthToSharpness(25), false);
        const strong = await render(strengthToSharpness(100), false);
        const wContrast = px(weak[4], 4)[0] - px(weak[4], 3)[0];
        const sContrast2 = px(strong[4], 4)[0] - px(strong[4], 3)[0];
        if (sContrast2 >= wContrast) {
          ok(`强度单调递增 (25→${wContrast}, 100→${sContrast2})`);
        } else {
          fail(`强度非单调: 25→${wContrast} 反而高于 100→${sContrast2}`);
        }

        finish(log.some((l) => l.startsWith("FAIL")) ? "failed" : "passed");
      } catch (err) {
        if (err.message !== "__handled__") {
          fail(err.message);
          finish("error");
        }
      }
    </script>
  </body>
</html>
